name: Validate TagBlock

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run monthly to catch upcoming Home Assistant Core breaking changes early
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  pytest:
    name: Unit Tests (HA Core Compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run TagBlock unit tests
        run: pytest -v

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          ignore: brands description topics issues

  syntax:
    name: Python, JSON & Frontend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python files
        run: python -m py_compile custom_components/tagblock/*.py tests/*.py
      - name: Validate JSON files
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['hacs.json', 'custom_components/tagblock/manifest.json', 'custom_components/tagblock/strings.json', 'custom_components/tagblock/translations/en.json']]"
      - name: Check Frontend JS
        run: node --check custom_components/tagblock/frontend/tagblock-panel.js
